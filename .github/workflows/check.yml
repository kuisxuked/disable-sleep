name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./test.sh
      - run: ARCHS='arm64 x86_64' ./build.sh
      - run: swift build --scratch-path .build/swiftpm
      - run: codesign --verify --strict 'LidOff.app'
